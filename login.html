<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cake Atelier</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            display: flex;
            background-color: #f1f1f1;
            flex-direction:column;
        }


        .navbar ul {
            list-style-type: none;
            background-color: #394d66;
            padding-left: 0px;
            padding-right: 0px;
            margin: 0px;
            overflow: hidden;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 25px;
            display: block;
            text-align: center;
        }

        .navbar a:hover {
            background-color: hsl(191, 93%, 39%);
        }

        .navbar li {
            float: left;
            padding-right: 10px;
            margin-right: 40px;
        }

        .navbar img {
            max-width: 100%;
            height: auto;
        }
        
        .myPage {
            display: flex; 
            margin-top: 30px; 
        }

        .login {
            float: left;
            width: 50%;
            margin: 0px 10px 30px 10px;
            padding: 10px;
            border: 3px solid;
            border-radius: 7px;
            text-align:center;
        }

        .register {
            width: 50%;
            margin: 0px 10px 30px 10px;
            padding:10px;
            border: 3px solid;
            border-radius: 7px;
            text-align:center;
        }

        
        .footer {
            background-color: #394d66;
            color: white;
            text-align: center;
            padding: 20px 10px 10px 20px; 
        }

        .contact {
            text-decoration: none;
            color: white;
            margin-bottom: 10px;
        }
       
        .logos a {
            margin:20px 20px 0px 20px;
        }
        .logos a:hover{
            background-color:white;
        }

    </style>
</head>

<body>
    <nav class="navbar">
        <ul>
            <li id="first"><a href=""><img src="logo.jpeg" alt="Logo image" width="30"></a></li>
            <li><a href="">Home</a></li>
            <li><a href="">Celebration Cakes</a></li>
            <li><a href="">Cupcakes</a></li>
            <li><a href="">Weddings</a></li>
            <li><a href="">Contact US</a></li>
            <li><a href="">Login</a></li>
            <li><a href="">Register</a></li>
            <li><a href=""><img src="cart.jpeg" alt="Cart image" width="30"></a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="myPage">
            <div class="login">
                <h5 style="margin:0;">Login</h5>
                <br>
                <form method="post" action="https://www.deitel.com">
                    <input type="hidden" name="userdata" value="deitel@deitel.com">
                    <input type="hidden" name="subject" value="Feedback Form">
                    <input type="hidden" name="redirect" value="login.html">
                    <p>
                        <label>Email Address</label>
                        <br>
                        <input name="name" type="text" size="25" maxlength="30">
                    </p>
                    <p>
                        <label>Password</label>
                        <br>
                        <input name="loginButton" type="text" size="25" maxlength="30">
                    </p>
                    <input type="submit" value="Login">
                </form>
            </div>

            <div class="register">
                <h5 style="margin:0;">New Customer</h5>
                <br>
                <form method="post" action="https://www.deitel.com">
                    <input type="hidden" name="userdata" value="deitel@deitel.com">
                    <input type="hidden" name="subject" value="Feedback Form">
                    <input type="hidden" name="redirect" value="login.html">
                    <p>Don't have an account?</p>
                    <p>Let's create an account to buy perfect</p>
                    <p>cakes and cupcakes</p>
                    <br>
                    <input type="submit" value="Register">
                </form>

            </div>


        </div>

        <div class="footer">
            <p>CONTACT US</p>
            <p><a href="www.google.com" class="contact"><img src="phone.jpg" alt="facebook" width="15">+90543252353224</a></p>
            <div class="logos">
                <a href=""><img src="wp.png" alt="whatsapp" width="50"></a>
                <a href=""><img src="instagram.png" alt="instagram" width="50"></a>
                <a href=""><img src="facebook.png" alt="facebook" width="50"></a>
            </div>
            <br>
            &copy; copyright reserved
        </div>
    </div>

</body>
</html>
